name = "elevated-notary-services"
main = "worker/index.js"
compatibility_date = "2026-04-01"
workers_dev = true

[assets]
directory = "publish_output/wwwroot"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
LEAD_NOTIFICATION_EMAIL = "info@jbdigitalservices.net"
BREVO_SENDER_EMAIL = "info@jbdigitalservices.net"
DEMO_MODE = "true"

[[routes]]
pattern = "elevatednotary.jbdigitalservices.net"
custom_domain = true
